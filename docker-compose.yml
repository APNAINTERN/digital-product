services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: seovision
      POSTGRES_PASSWORD: seovision
      POSTGRES_DB: seovision
    volumes:
      - seovision_pg:/var/lib/postgresql/data

volumes:
  seovision_pg:
